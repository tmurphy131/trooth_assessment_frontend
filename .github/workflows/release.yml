name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which store(s) to build and upload
        type: choice
        options: [both, ios, android]
        default: both

env:
  API_BASE_URL: https://trooth-discipleship-api.onlyblv.com/

jobs:
  # Don't ship a build that fails analysis or tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.5', cache: true }
      - run: flutter pub get
      # Infos (avoid_print etc.) are reported but don't fail the build.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    if: github.event_name == 'push' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.5', cache: true }
      - name: Write signing config
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          printf "storeFile=../upload-keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n" \
            "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.trooth.flutterTroothAssessment
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

  ios:
    needs: test
    if: github.event_name == 'push' || inputs.platform != 'android'
    runs-on: macos-26
    steps:
      # Flutter 3.47's Swift Package Manager support and App Store uploads
      # both need a current Xcode; macos-15 defaults to 16.4.
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version
      # Don't persist GITHUB_TOKEN in git config: match adds its own
      # Authorization header, and two headers make GitHub return HTTP 400.
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.5', cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true, working-directory: ios }
      - run: flutter pub get && cd ios && bundle exec pod install
      # match expects base64("user:token"); accept a raw github_pat_ token too.
      - name: Prepare match git auth
        env:
          MATCH_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          case "$MATCH_AUTH" in
            github_pat_*|ghp_*) MATCH_AUTH=$(printf '%s' "tmurphy131:$MATCH_AUTH" | base64 | tr -d '\n') ;;
          esac
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_AUTH" >> "$GITHUB_ENV"
      - run: bundle exec fastlane beta
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
